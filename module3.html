<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moduł III - Stacker</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 50%, #0f1629 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            color: #e0e0e0;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(2px 2px at 20% 30%, #eee, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 60% 70%, #fff, rgba(0,0,0,0)),
                radial-gradient(1px 1px at 50% 50%, #ddd, rgba(0,0,0,0)),
                radial-gradient(1px 1px at 80% 10%, #fff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 90% 60%, #eee, rgba(0,0,0,0));
            background-repeat: repeat;
            background-size: 200% 200%;
            pointer-events: none;
            z-index: -1;
            animation: twinkle 5s infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 0.8; }
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            background: rgba(10, 14, 39, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(66, 135, 245, 0.2);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 1.2em;
            cursor: pointer;
        }

        .nav-links {
            display: flex;
            gap: 30px;
            align-items: center;
        }

        .nav-links a {
            color: #a0a0a0;
            text-decoration: none;
            font-size: 0.95em;
            transition: color 0.3s ease;
            cursor: pointer;
        }

        .nav-links a:hover {
            color: #4287f5;
        }

        .container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .content-wrapper {
            background: rgba(26, 31, 58, 0.6);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(66, 135, 245, 0.2);
            border-radius: 20px;
            padding: 40px;
            max-width: 900px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #00ffff 0%, #00aaff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 3px;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(0, 255, 255, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }

        .subtitle {
            color: #a0a0a0;
            margin-bottom: 30px;
            font-size: 1.1em;
        }

        .game-info {
            display: flex;
            justify-content: space-around;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .info-box {
            background: rgba(0, 255, 255, 0.1);
            border: 2px solid rgba(0, 255, 255, 0.3);
            border-radius: 10px;
            padding: 15px 25px;
            min-width: 150px;
        }

        .info-label {
            color: #a0a0a0;
            font-size: 0.9em;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        .info-value {
            color: #00ffff;
            font-size: 1.8em;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(0, 255, 255, 0.5);
        }

        #gameCanvas {
            border: 3px solid rgba(0, 255, 255, 0.5);
            background: rgba(10, 14, 39, 0.95);
            border-radius: 10px;
            display: block;
            margin: 30px auto;
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.3);
            cursor: pointer;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
            flex-wrap: wrap;
        }

        button {
            padding: 12px 30px;
            font-size: 1em;
            border: 2px solid;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            background: transparent;
        }

        .btn-start {
            border-color: #00ffff;
            color: #00ffff;
        }

        .btn-start:hover {
            background: rgba(0, 255, 255, 0.15);
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.3);
            transform: translateY(-2px);
        }

        .btn-reset {
            border-color: #ff6b6b;
            color: #ff6b6b;
        }

        .btn-reset:hover {
            background: rgba(255, 107, 107, 0.15);
            box-shadow: 0 0 20px rgba(255, 107, 107, 0.3);
            transform: translateY(-2px);
        }

        .game-over {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.95);
            padding: 50px;
            border-radius: 20px;
            border: 3px solid #ff6b6b;
            text-align: center;
            z-index: 500;
            animation: slideDown 0.5s ease;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translate(-50%, -60%);
            }
            to {
                opacity: 1;
                transform: translate(-50%, -50%);
            }
        }

        .game-over.show {
            display: block;
        }

        .game-over h2 {
            color: #ff6b6b;
            font-size: 2.5em;
            margin-bottom: 20px;
            text-shadow: 0 0 20px rgba(255, 107, 107, 0.8);
        }

        .game-over p {
            color: #c0c0c0;
            font-size: 1.2em;
            margin-bottom: 20px;
        }

        .modules-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 30px;
            padding: 20px;
            background: rgba(10, 14, 39, 0.9);
            border: 2px solid rgba(0, 255, 255, 0.3);
            border-radius: 15px;
            flex-wrap: wrap;
        }

        .module-item {
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid rgba(0, 255, 255, 0.4);
            border-radius: 10px;
            background: rgba(26, 31, 58, 0.8);
            font-size: 1.8em;
            transition: all 0.3s ease;
        }

        .module-item.inactive {
            opacity: 0.6;
        }

        .module-item.active {
            border-color: #00ffff;
            background: rgba(0, 255, 255, 0.2);
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.4);
            transform: scale(1.1);
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 1.8em;
            }

            #gameCanvas {
                max-width: 100%;
            }

            .content-wrapper {
                padding: 20px;
            }

            button {
                padding: 10px 20px;
                font-size: 0.9em;
            }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="logo">⚠️ HAKOWANIE</div>
        <div class="nav-links">
            <a href="module2.html">Wróć</a>
            <span style="font-size: 1.5em; cursor: pointer;">🎮</span>
        </div>
    </nav>

    <div class="container">
        <div class="content-wrapper">
            <h1><span style="font-size: 1.2em;">🟩</span>STACKER</h1>
            <p class="subtitle">Ułóż wieżę nie spadając z krawędzi</p>

            <div class="game-info">
                <div class="info-box">
                    <div class="info-label">Poziom</div>
                    <div class="info-value" id="level">1</div>
                </div>
                <div class="info-box">
                    <div class="info-label">Cel</div>
                    <div class="info-value" id="goal">10</div>
                </div>
            </div>

            <canvas id="gameCanvas" width="300" height="500"></canvas>

            <div class="controls">
                <button class="btn-start" onclick="startGame()">▶ Start / Space</button>
                <button class="btn-reset" onclick="resetGame()">↻ Reset</button>
            </div>

            <div class="modules-container" id="modulesContainer"></div>
        </div>
    </div>

    <div class="game-over" id="gameOver">
        <h2 id="gameOverTitle">GAME OVER</h2>
        <p id="gameOverText">Poziom: 0</p>
    </div>

    <script>
        // Audio context
        const audioContext = new (window.AudioContext || window.webkitAudioContext)();

        function playSoftClickSound() {
            const osc = audioContext.createOscillator();
            const gain = audioContext.createGain();
            osc.connect(gain);
            gain.connect(audioContext.destination);
            osc.frequency.value = 600;
            osc.type = 'sine';
            gain.gain.setValueAtTime(0.15, audioContext.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.15);
            osc.start(audioContext.currentTime);
            osc.stop(audioContext.currentTime + 0.15);
        }

        function playStackSound() {
            const osc = audioContext.createOscillator();
            const gain = audioContext.createGain();
            osc.connect(gain);
            gain.connect(audioContext.destination);
            osc.frequency.setValueAtTime(300, audioContext.currentTime);
            osc.frequency.linearRampToValueAtTime(600, audioContext.currentTime + 0.1);
            osc.type = 'sine';
            gain.gain.setValueAtTime(0.12, audioContext.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.1);
            osc.start(audioContext.currentTime);
            osc.stop(audioContext.currentTime + 0.1);
        }

        function playGameOverSound() {
            const osc = audioContext.createOscillator();
            const gain = audioContext.createGain();
            osc.connect(gain);
            gain.connect(audioContext.destination);
            osc.frequency.setValueAtTime(600, audioContext.currentTime);
            osc.frequency.linearRampToValueAtTime(200, audioContext.currentTime + 0.3);
            osc.type = 'sine';
            gain.gain.setValueAtTime(0.2, audioContext.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.3);
            osc.start(audioContext.currentTime);
            osc.stop(audioContext.currentTime + 0.3);
        }

        function playSuccessSound() {
            const osc = audioContext.createOscillator();
            const gain = audioContext.createGain();
            osc.connect(gain);
            gain.connect(audioContext.destination);
            osc.frequency.setValueAtTime(400, audioContext.currentTime);
            osc.frequency.linearRampToValueAtTime(800, audioContext.currentTime + 0.15);
            osc.type = 'sine';
            gain.gain.setValueAtTime(0.15, audioContext.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.15);
            osc.start(audioContext.currentTime);
            osc.stop(audioContext.currentTime + 0.15);
        }

        // Game variables
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const COLS = 10;
        const BLOCK_HEIGHT = 15;
        const GOAL = 10;
        const COLORS = ['#00ffff', '#00aa88', '#0088ff'];

        let blocks = [];
        let movingBlock = null;
        let blockDirection = 1;
        let blockSpeed = 3;
        let gameRunning = false;
        let level = 0;
        let gameActive = true;

        // Keyboard controls
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                playSoftClickSound();
                if (!gameRunning) {
                    startGame();
                } else {
                    placeBlock();
                }
            }
        });

        canvas.addEventListener('click', () => {
            playSoftClickSound();
            if (!gameRunning) {
                startGame();
            } else {
                placeBlock();
            }
        });

        function startGame() {
            playSoftClickSound();
            if (!gameActive) return;
            gameRunning = true;
            if (level === 0) {
                createNewBlock();
            }
            gameLoop();
        }

        function resetGame() {
            playSoftClickSound();
            blocks = [];
            movingBlock = null;
            level = 0;
            gameRunning = false;
            gameActive = true;
            document.getElementById('level').textContent = level;
            document.getElementById('gameOver').classList.remove('show');
            draw();
        }

        function createNewBlock() {
            const width = Math.max(2, COLS - Math.floor(level / 2));
            const startX = Math.floor(Math.random() * (COLS - width));
            movingBlock = {
                x: startX,
                width: width,
                y: canvas.height - (level * BLOCK_HEIGHT) - BLOCK_HEIGHT
            };
            blockSpeed = 2 + (level * 0.3);
            blockDirection = Math.random() > 0.5 ? 1 : -1;
        }

        function placeBlock() {
            if (!movingBlock) return;

            playStackSound();

            const lastBlock = blocks[blocks.length - 1];
            let newWidth = movingBlock.width;

            if (lastBlock) {
                const overlap = getOverlap(movingBlock, lastBlock);
                if (overlap <= 0) {
                    endGame();
                    return;
                }
                newWidth = overlap;
            }

            if (newWidth <= 0) {
                endGame();
                return;
            }

            blocks.push({
                x: movingBlock.x,
                width: newWidth,
                y: movingBlock.y
            });

            level++;
            document.getElementById('level').textContent = level;

            if (level >= GOAL) {
                endGameSuccess();
                return;
            }

            movingBlock = null;
            createNewBlock();
        }

        function getOverlap(block1, block2) {
            const left1 = block1.x;
            const right1 = block1.x + block1.width;
            const left2 = block2.x;
            const right2 = block2.x + block2.width;

            const overlapLeft = Math.max(left1, left2);
            const overlapRight = Math.min(right1, right2);

            return Math.max(0, overlapRight - overlapLeft);
        }

        function gameLoop() {
            update();
            draw();
            if (gameRunning) {
                requestAnimationFrame(gameLoop);
            }
        }

        function update() {
            if (movingBlock) {
                movingBlock.x += blockDirection * blockSpeed;

                if (movingBlock.x <= 0) {
                    movingBlock.x = 0;
                    blockDirection = 1;
                }
                if (movingBlock.x + movingBlock.width >= COLS) {
                    movingBlock.x = COLS - movingBlock.width;
                    blockDirection = -1;
                }
            }
        }

        function draw() {
            ctx.fillStyle = 'rgba(10, 14, 39, 0.95)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw grid
            ctx.strokeStyle = 'rgba(0, 255, 255, 0.1)';
            ctx.lineWidth = 1;
            const blockWidth = canvas.width / COLS;

            for (let i = 0; i <= COLS; i++) {
                ctx.beginPath();
                ctx.moveTo(i * blockWidth, 0);
                ctx.lineTo(i * blockWidth, canvas.height);
                ctx.stroke();
            }

            // Draw blocks
            blocks.forEach((block, idx) => {
                ctx.fillStyle = COLORS[idx % COLORS.length];
                ctx.shadowBlur = 10;
                ctx.shadowColor = COLORS[idx % COLORS.length];
                ctx.fillRect(
                    block.x * blockWidth + 2,
                    block.y + 2,
                    block.width * blockWidth - 4,
                    BLOCK_HEIGHT - 4
                );
                ctx.shadowBlur = 0;
            });

            // Draw moving block
            if (movingBlock) {
                ctx.fillStyle = '#00ffff';
                ctx.globalAlpha = 0.7;
                ctx.shadowBlur = 15;
                ctx.shadowColor = '#00ffff';
                ctx.fillRect(
                    movingBlock.x * blockWidth + 2,
                    movingBlock.y + 2,
                    movingBlock.width * blockWidth - 4,
                    BLOCK_HEIGHT - 4
                );
                ctx.globalAlpha = 1.0;
                ctx.shadowBlur = 0;
            }
        }

        function endGame() {
            gameRunning = false;
            gameActive = false;
            playGameOverSound();

            document.getElementById('gameOverTitle').textContent = 'GAME OVER';
            document.getElementById('gameOverText').textContent = `Poziom: ${level}`;
            document.getElementById('gameOver').classList.add('show');
        }

        function endGameSuccess() {
            gameRunning = false;
            gameActive = false;
            playSuccessSound();

            document.getElementById('gameOverTitle').textContent = '✓ ZWYCIĘSTWO!';
            document.getElementById('gameOverText').textContent = `Poziom: ${level} / ${GOAL}`;
            document.getElementById('gameOver').classList.add('show');
        }

        function initModules() {
            const modulesContainer = document.getElementById('modulesContainer');
            const moduleEmojis = ['📄', '🐍', '🟩', '⚙️', '🎯'];

            for (let i = 0; i < 5; i++) {
                const moduleItem = document.createElement('div');
                moduleItem.className = 'module-item';
                if (i === 2) {
                    moduleItem.classList.add('active');
                } else {
                    moduleItem.classList.add('inactive');
                }
                
                const emoji = moduleEmojis[i];
                moduleItem.textContent = emoji;
                modulesContainer.appendChild(moduleItem);
            }
        }

        draw();
        initModules();
    </script>
</body>
</html>
