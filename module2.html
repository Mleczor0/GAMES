<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moduł II - Snake</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 50%, #0f1629 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            color: #e0e0e0;
            position: relative;
            overflow-x: hidden;
        }

        /* Animowane tło z gwiazdkami */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(2px 2px at 20% 30%, #eee, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 60% 70%, #fff, rgba(0,0,0,0)),
                radial-gradient(1px 1px at 50% 50%, #ddd, rgba(0,0,0,0)),
                radial-gradient(1px 1px at 80% 10%, #fff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 90% 60%, #eee, rgba(0,0,0,0));
            background-repeat: repeat;
            background-size: 200% 200%;
            pointer-events: none;
            z-index: -1;
            animation: twinkle 5s infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 0.8; }
        }

        /* Navbar */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            background: rgba(10, 14, 39, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(66, 135, 245, 0.2);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 1.2em;
            cursor: pointer;
        }

        .nav-links {
            display: flex;
            gap: 30px;
            align-items: center;
        }

        .nav-links a {
            color: #a0a0a0;
            text-decoration: none;
            font-size: 0.95em;
            transition: color 0.3s ease;
            cursor: pointer;
        }

        .nav-links a:hover {
            color: #4287f5;
        }

        .container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .content-wrapper {
            background: rgba(26, 31, 58, 0.6);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(66, 135, 245, 0.2);
            border-radius: 20px;
            padding: 40px;
            max-width: 900px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #fff 0%, #4287f5 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 2px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }

        .subtitle {
            color: #a0a0a0;
            margin-bottom: 30px;
            font-size: 1.1em;
        }

        .game-info {
            display: flex;
            justify-content: space-around;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .info-box {
            background: rgba(66, 135, 245, 0.1);
            border: 2px solid rgba(66, 135, 245, 0.3);
            border-radius: 10px;
            padding: 15px 25px;
            min-width: 150px;
        }

        .info-label {
            color: #a0a0a0;
            font-size: 0.9em;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        .info-value {
            color: #4ade80;
            font-size: 1.8em;
            font-weight: bold;
        }

        #gameCanvas {
            border: 3px solid rgba(74, 222, 128, 0.5);
            background: rgba(10, 14, 39, 0.95);
            border-radius: 10px;
            display: block;
            margin: 30px auto;
            box-shadow: 0 0 20px rgba(74, 222, 128, 0.3);
            cursor: pointer;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
            flex-wrap: wrap;
        }

        button {
            padding: 12px 30px;
            font-size: 1em;
            border: 2px solid;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            background: transparent;
        }

        .btn-start {
            border-color: #4ade80;
            color: #4ade80;
        }

        .btn-start:hover {
            background: rgba(74, 222, 128, 0.15);
            box-shadow: 0 0 20px rgba(74, 222, 128, 0.3);
            transform: translateY(-2px);
        }

        .btn-reset {
            border-color: #ff6b6b;
            color: #ff6b6b;
        }

        .btn-reset:hover {
            background: rgba(255, 107, 107, 0.15);
            box-shadow: 0 0 20px rgba(255, 107, 107, 0.3);
            transform: translateY(-2px);
        }

        .game-over {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.95);
            padding: 50px;
            border-radius: 20px;
            border: 3px solid #ff6b6b;
            text-align: center;
            z-index: 500;
            animation: slideDown 0.5s ease;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translate(-50%, -60%);
            }
            to {
                opacity: 1;
                transform: translate(-50%, -50%);
            }
        }

        .game-over.show {
            display: block;
        }

        .game-over h2 {
            color: #ff6b6b;
            font-size: 2.5em;
            margin-bottom: 20px;
            text-shadow: 0 0 20px rgba(255, 107, 107, 0.8);
        }

        .game-over p {
            color: #c0c0c0;
            font-size: 1.2em;
            margin-bottom: 20px;
        }

        .modules-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 30px;
            padding: 20px;
            background: rgba(10, 14, 39, 0.9);
            border: 2px solid rgba(66, 135, 245, 0.3);
            border-radius: 15px;
            flex-wrap: wrap;
        }

        .module-item {
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid rgba(66, 135, 245, 0.4);
            border-radius: 10px;
            background: rgba(26, 31, 58, 0.8);
            font-size: 1.8em;
            transition: all 0.3s ease;
        }

        .module-item.inactive {
            opacity: 0.6;
        }

        .module-item.active {
            border-color: #4287f5;
            background: rgba(66, 135, 245, 0.2);
            box-shadow: 0 0 20px rgba(66, 135, 245, 0.4);
            transform: scale(1.1);
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 1.8em;
            }

            #gameCanvas {
                max-width: 100%;
            }

            .content-wrapper {
                padding: 20px;
            }

            button {
                padding: 10px 20px;
                font-size: 0.9em;
            }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="logo">⚠️ HAKOWANIE</div>
        <div class="nav-links">
            <a href="crossword.html">Wróć</a>
            <span style="font-size: 1.5em; cursor: pointer;">🎮</span>
        </div>
    </nav>

    <div class="container">
        <div class="content-wrapper">
            <h1><span style="font-size: 1.2em;">🔑</span>Moduł II</h1>
            <p class="subtitle">Zbierz kulki, unikaj ślepych zaułków</p>

            <div class="game-info">
                <div class="info-box">
                    <div class="info-label">Wynik</div>
                    <div class="info-value" id="score">0</div>
                </div>
                <div class="info-box">
                    <div class="info-label">Długość</div>
                    <div class="info-value" id="length">3</div>
                </div>
                <div class="info-box">
                    <div class="info-label">Highest</div>
                    <div class="info-value" id="highScore">0</div>
                </div>
            </div>

            <canvas id="gameCanvas" width="400" height="400"></canvas>

            <div class="controls">
                <button class="btn-start" onclick="startGame()">▶ Start</button>
                <button class="btn-reset" onclick="resetGame()">↻ Reset</button>
            </div>

            <div class="modules-container" id="modulesContainer"></div>
        </div>
    </div>

    <div class="game-over" id="gameOver">
        <h2>GAME OVER</h2>
        <p id="gameOverText">Wynik: 0</p>
    </div>

    <script>
        // Audio context
        const audioContext = new (window.AudioContext || window.webkitAudioContext)();

        function playClickSound() {
            const osc = audioContext.createOscillator();
            const gain = audioContext.createGain();
            osc.connect(gain);
            gain.connect(audioContext.destination);
            osc.frequency.value = 800;
            osc.type = 'sine';
            gain.gain.setValueAtTime(0.3, audioContext.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.1);
            osc.start(audioContext.currentTime);
            osc.stop(audioContext.currentTime + 0.1);
        }

        function playEatSound() {
            const osc = audioContext.createOscillator();
            const gain = audioContext.createGain();
            osc.connect(gain);
            gain.connect(audioContext.destination);
            osc.frequency.setValueAtTime(600, audioContext.currentTime);
            osc.frequency.linearRampToValueAtTime(1000, audioContext.currentTime + 0.1);
            osc.type = 'sine';
            gain.gain.setValueAtTime(0.3, audioContext.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.1);
            osc.start(audioContext.currentTime);
            osc.stop(audioContext.currentTime + 0.1);
        }

        function playGameOverSound() {
            const osc = audioContext.createOscillator();
            const gain = audioContext.createGain();
            osc.connect(gain);
            gain.connect(audioContext.destination);
            osc.frequency.setValueAtTime(800, audioContext.currentTime);
            osc.frequency.linearRampToValueAtTime(200, audioContext.currentTime + 0.3);
            osc.type = 'sine';
            gain.gain.setValueAtTime(0.3, audioContext.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.3);
            osc.start(audioContext.currentTime);
            osc.stop(audioContext.currentTime + 0.3);
        }

        // Game variables
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const gridSize = 20;
        const tileCount = canvas.width / gridSize;

        let snake = [{x: 10, y: 10}];
        let food = {x: Math.floor(Math.random() * tileCount), y: Math.floor(Math.random() * tileCount)};
        let dx = 1;
        let dy = 0;
        let nextDx = 1;
        let nextDy = 0;
        let gameRunning = false;
        let gameSpeed = 100;
        let lastUpdateTime = 0;
        let score = 0;
        let highScore = localStorage.getItem('snakeHighScore') || 0;

        document.getElementById('highScore').textContent = highScore;

        // Keyboard controls
        document.addEventListener('keydown', (e) => {
            playClickSound();
            switch(e.key) {
                case 'ArrowUp':
                    if (dy === 0) { nextDx = 0; nextDy = -1; }
                    break;
                case 'ArrowDown':
                    if (dy === 0) { nextDx = 0; nextDy = 1; }
                    break;
                case 'ArrowLeft':
                    if (dx === 0) { nextDx = -1; nextDy = 0; }
                    break;
                case 'ArrowRight':
                    if (dx === 0) { nextDx = 1; nextDy = 0; }
                    break;
            }
        });

        canvas.addEventListener('click', startGame);

        function startGame() {
            playClickSound();
            if (!gameRunning) {
                gameRunning = true;
                gameLoop();
            }
        }

        function resetGame() {
            playClickSound();
            snake = [{x: 10, y: 10}];
            food = {x: Math.floor(Math.random() * tileCount), y: Math.floor(Math.random() * tileCount)};
            dx = 1;
            dy = 0;
            nextDx = 1;
            nextDy = 0;
            gameRunning = false;
            score = 0;
            document.getElementById('score').textContent = score;
            document.getElementById('length').textContent = snake.length;
            document.getElementById('gameOver').classList.remove('show');
            draw();
        }

        function gameLoop() {
            const now = Date.now();
            const deltaTime = now - lastUpdateTime;

            if (deltaTime > gameSpeed) {
                update();
                draw();
                lastUpdateTime = now;
            }

            if (gameRunning) {
                requestAnimationFrame(gameLoop);
            }
        }

        function update() {
            dx = nextDx;
            dy = nextDy;

            const head = {x: snake[0].x + dx, y: snake[0].y + dy};

            // Check collisions
            if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
                endGame();
                return;
            }

            for (let segment of snake) {
                if (head.x === segment.x && head.y === segment.y) {
                    endGame();
                    return;
                }
            }

            snake.unshift(head);

            if (head.x === food.x && head.y === food.y) {
                playEatSound();
                score += 10;
                document.getElementById('score').textContent = score;
                document.getElementById('length').textContent = snake.length;
                food = {x: Math.floor(Math.random() * tileCount), y: Math.floor(Math.random() * tileCount)};
                gameSpeed = Math.max(50, gameSpeed - 2);
            } else {
                snake.pop();
            }
        }

        function draw() {
            ctx.fillStyle = 'rgba(10, 14, 39, 0.95)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw snake
            ctx.fillStyle = '#4ade80';
            for (let i = 0; i < snake.length; i++) {
                const segment = snake[i];
                if (i === 0) {
                    ctx.fillStyle = '#6ee7b7';
                } else {
                    ctx.fillStyle = '#4ade80';
                }
                ctx.fillRect(segment.x * gridSize + 1, segment.y * gridSize + 1, gridSize - 2, gridSize - 2);
            }

            // Draw food
            ctx.fillStyle = '#ff6b6b';
            ctx.beginPath();
            ctx.arc(food.x * gridSize + gridSize / 2, food.y * gridSize + gridSize / 2, gridSize / 2 - 2, 0, Math.PI * 2);
            ctx.fill();

            // Draw grid
            ctx.strokeStyle = 'rgba(66, 135, 245, 0.1)';
            ctx.lineWidth = 0.5;
            for (let i = 0; i <= tileCount; i++) {
                ctx.beginPath();
                ctx.moveTo(i * gridSize, 0);
                ctx.lineTo(i * gridSize, canvas.height);
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(0, i * gridSize);
                ctx.lineTo(canvas.width, i * gridSize);
                ctx.stroke();
            }
        }

        function endGame() {
            gameRunning = false;
            playGameOverSound();

            if (score > highScore) {
                highScore = score;
                localStorage.setItem('snakeHighScore', highScore);
                document.getElementById('highScore').textContent = highScore;
            }

            document.getElementById('gameOverText').textContent = `Wynik: ${score}`;
            document.getElementById('gameOver').classList.add('show');
        }

        // Initialize modules
        function initModules() {
            const modulesContainer = document.getElementById('modulesContainer');
            const moduleEmojis = ['📄', '🔑', '💾', '⚙️', '🎯', '🔐', '📡', '🎲', '💎', '🌌'];

            for (let i = 0; i < 5; i++) {
                const moduleItem = document.createElement('div');
                moduleItem.className = 'module-item';
                if (i === 1) {
                    moduleItem.classList.add('active');
                } else {
                    moduleItem.classList.add('inactive');
                }
                
                const emoji = moduleEmojis[Math.floor(Math.random() * moduleEmojis.length)];
                moduleItem.textContent = emoji;
                modulesContainer.appendChild(moduleItem);
            }
        }

        draw();
        initModules();
    </script>
</body>
</html>
