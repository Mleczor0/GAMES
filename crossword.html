<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Krzyżówka - Zwierzęta</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 50%, #0f1629 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            color: #e0e0e0;
            position: relative;
            overflow-x: hidden;
        }

        /* Animowane tło z gwiazdkami */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(2px 2px at 20% 30%, #eee, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 60% 70%, #fff, rgba(0,0,0,0)),
                radial-gradient(1px 1px at 50% 50%, #ddd, rgba(0,0,0,0)),
                radial-gradient(1px 1px at 80% 10%, #fff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 90% 60%, #eee, rgba(0,0,0,0));
            background-repeat: repeat;
            background-size: 200% 200%;
            pointer-events: none;
            z-index: -1;
            animation: twinkle 5s infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 0.8; }
        }

        /* Navbar */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            background: rgba(10, 14, 39, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(66, 135, 245, 0.2);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 1.8em;
            font-weight: bold;
            color: #fff;
            letter-spacing: 2px;
        }

        .logo span {
            color: #4287f5;
        }

        .nav-links {
            display: flex;
            gap: 30px;
            align-items: center;
        }

        .nav-links a {
            color: #a0a0a0;
            text-decoration: none;
            font-size: 0.95em;
            transition: color 0.3s ease;
            cursor: pointer;
        }

        .nav-links a:hover {
            color: #4287f5;
        }

        .nav-links a.active {
            color: #4287f5;
            border-bottom: 2px solid #4287f5;
            padding-bottom: 5px;
        }

        .container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 60px 20px;
        }

        .content-wrapper {
            background: rgba(26, 31, 58, 0.6);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(66, 135, 245, 0.2);
            border-radius: 20px;
            padding: 60px;
            max-width: 1200px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }

        .header {
            text-align: center;
            margin-bottom: 50px;
        }

        .badge {
            display: inline-block;
            border: 1px solid rgba(66, 135, 245, 0.5);
            border-radius: 30px;
            padding: 8px 16px;
            font-size: 0.85em;
            color: #4287f5;
            margin-bottom: 20px;
            letter-spacing: 1px;
        }

        h1 {
            font-size: 3em;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #fff 0%, #4287f5 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 3px;
        }

        .subtitle {
            font-size: 1.2em;
            color: #a0a0a0;
            margin-bottom: 10px;
        }

        .description {
            color: #707090;
            font-size: 0.95em;
            line-height: 1.6;
        }

        .content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 50px;
            margin-bottom: 40px;
        }

        .crossword-section h2,
        .clues-section h2 {
            color: #4287f5;
            margin-bottom: 25px;
            font-size: 1.4em;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .crossword-grid {
            display: inline-block;
            border: 3px solid #4287f5;
            background: rgba(10, 14, 39, 0.9);
            box-shadow: 0 0 20px rgba(66, 135, 245, 0.3);
            border-radius: 8px;
            overflow: hidden;
        }

        .row {
            display: flex;
        }

        .cell {
            width: 45px;
            height: 45px;
            border: 1px solid rgba(66, 135, 245, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(26, 31, 58, 0.8);
            position: relative;
        }

        .cell.black {
            background: #000;
            border-color: #000;
        }

        .cell input {
            width: 100%;
            height: 100%;
            border: none;
            text-align: center;
            font-size: 16px;
            font-weight: bold;
            text-transform: uppercase;
            background: rgba(26, 31, 58, 0.8);
            cursor: pointer;
            padding: 0;
            color: #fff;
        }

        .cell input:focus {
            background: rgba(66, 135, 245, 0.3);
            outline: none;
            box-shadow: inset 0 0 10px rgba(66, 135, 245, 0.5);
        }

        .cell input.correct {
            color: #4ade80;
            background: rgba(74, 222, 128, 0.1);
            box-shadow: inset 0 0 10px rgba(74, 222, 128, 0.3);
        }

        .cell input.incorrect {
            color: #ff6b6b;
            background: rgba(255, 107, 107, 0.1);
            box-shadow: inset 0 0 10px rgba(255, 107, 107, 0.3);
        }

        .cell-number {
            position: absolute;
            top: 3px;
            left: 3px;
            font-size: 11px;
            font-weight: bold;
            color: #4287f5;
            line-height: 1;
        }

        .clues-section {
            max-height: 600px;
            overflow-y: auto;
            padding-right: 15px;
        }

        .clues-section::-webkit-scrollbar {
            width: 8px;
        }

        .clues-section::-webkit-scrollbar-track {
            background: rgba(66, 135, 245, 0.1);
            border-radius: 10px;
        }

        .clues-section::-webkit-scrollbar-thumb {
            background: rgba(66, 135, 245, 0.5);
            border-radius: 10px;
        }

        .clues-section::-webkit-scrollbar-thumb:hover {
            background: rgba(66, 135, 245, 0.8);
        }

        .clues-group {
            margin-bottom: 30px;
        }

        .clues-group h3 {
            color: #4287f5;
            font-size: 1.1em;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid rgba(66, 135, 245, 0.3);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .clue {
            padding: 12px 15px;
            margin-bottom: 10px;
            background: rgba(66, 135, 245, 0.08);
            border-left: 3px solid #4287f5;
            border-radius: 5px;
            transition: all 0.3s ease;
        }

        .clue:hover {
            background: rgba(66, 135, 245, 0.15);
            padding-left: 20px;
        }

        .clue-number {
            font-weight: bold;
            color: #4287f5;
            margin-right: 10px;
        }

        .clue-text {
            color: #c0c0c0;
        }

        .button-container {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 30px;
        }

        button {
            padding: 14px 35px;
            font-size: 1em;
            border: 2px solid;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            background: transparent;
        }

        .btn-check {
            border-color: #4ade80;
            color: #4ade80;
        }

        .btn-check:hover {
            background: rgba(74, 222, 128, 0.15);
            box-shadow: 0 0 20px rgba(74, 222, 128, 0.3);
            transform: translateY(-2px);
        }

        .btn-reset {
            border-color: #ff6b6b;
            color: #ff6b6b;
        }

        .btn-reset:hover {
            background: rgba(255, 107, 107, 0.15);
            box-shadow: 0 0 20px rgba(255, 107, 107, 0.3);
            transform: translateY(-2px);
        }

        .btn-hint {
            border-color: #fbbf24;
            color: #fbbf24;
        }

        .btn-hint:hover {
            background: rgba(251, 191, 36, 0.15);
            box-shadow: 0 0 20px rgba(251, 191, 36, 0.3);
            transform: translateY(-2px);
        }

        .result-message {
            text-align: center;
            font-size: 1.1em;
            font-weight: bold;
            padding: 20px 30px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: none;
            border: 2px solid;
            backdrop-filter: blur(10px);
        }

        .result-message.success {
            background: rgba(74, 222, 128, 0.1);
            color: #4ade80;
            border-color: #4ade80;
        }

        .result-message.error {
            background: rgba(255, 107, 107, 0.1);
            color: #ff6b6b;
            border-color: #ff6b6b;
        }

        .score {
            text-align: center;
            font-size: 1.1em;
            color: #4287f5;
            font-weight: bold;
            margin-bottom: 20px;
        }

        @media (max-width: 768px) {
            .navbar {
                padding: 15px 20px;
            }

            .logo {
                font-size: 1.3em;
            }

            .nav-links {
                gap: 15px;
                font-size: 0.85em;
            }

            .content-wrapper {
                padding: 30px;
            }

            .content {
                grid-template-columns: 1fr;
                gap: 30px;
            }

            h1 {
                font-size: 2em;
            }

            .cell {
                width: 35px;
                height: 35px;
                font-size: 14px;
            }

            button {
                padding: 10px 20px;
                font-size: 0.9em;
            }

            .clues-section {
                max-height: 400px;
            }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="logo">XR<span>Games</span></div>
        <div class="nav-links">
            <a class="active">Strona Główna</a>
            <a href="#crossword">Krzyżówka</a>
            <a href="#about">O Nas</a>
        </div>
    </nav>

    <div class="container">
        <div class="content-wrapper">
            <div class="header">
                <div class="badge">🐾 KRZYŻÓWKA O ZWIERZĘTACH 🐾</div>
                <h1>Krzyżówka Zwierząt</h1>
                <p class="subtitle">Rozwiąż krzyżówkę i zgadnij nazwiska zwierząt</p>
                <p class="description">Sprawdź swoją wiedzę na temat zwierząt. Uzupełnij wszystkie pola i kliknij "Sprawdź odpowiedzi" aby zobaczyć wynik.</p>
            </div>

            <div class="content">
                <div class="crossword-section">
                    <h2>⬜ Krzyżówka</h2>
                    <div class="crossword-grid" id="crosswordGrid"></div>
                </div>

                <div class="clues-section">
                    <h2>📋 Hasła</h2>
                    <div class="clues-group">
                        <h3>⬇️ Pionowo</h3>
                        <div id="verticalClues"></div>
                    </div>
                    <div class="clues-group">
                        <h3>➡️ Poziomo</h3>
                        <div id="horizontalClues"></div>
                    </div>
                </div>
            </div>

            <div class="button-container">
                <button class="btn-check" onclick="checkAnswers()">✓ Sprawdź Odpowiedzi</button>
                <button class="btn-hint" onclick="showHint()">💡 Podpowiedź</button>
                <button class="btn-reset" onclick="resetCrossword()">↻ Wyczyść</button>
            </div>

            <div class="result-message" id="resultMessage"></div>
            <div class="score" id="score"></div>
        </div>
    </div>

    <script>
        // Definicja krzyżówki
        const crosswordData = {
            grid: [
                ['L', 'E', 'W', 0, 'K', 'O', 'T', 0, 0],
                [0, 0, 0, 0, 'O', 0, 'I', 0, 0],
                ['S', 'O', 'L', 0, 'W', 'O', 'L', 0, 0],
                ['O', 0, 'A', 0, 0, 0, 0, 0, 0],
                ['K', 0, 'C', 0, 'O', 'R', 'Ł', 'Y', 'K'],
                ['O', 0, 'I', 0, 'S', 0, 0, 0, 0],
                ['Ł', 0, 'A', 0, 'E', 'L', 'E', 'F', 'A', 'N', 'T']
            ],
            clues: {
                horizontal: [
                    { number: 1, clue: 'Duży drapieżnik z grzywą (5 liter)' },
                    { number: 4, clue: 'Domowe zwierzę które mruczy (3 litery)' },
                    { number: 6, clue: 'Małe zwierzę gryzące orzechy (7 liter)' },
                    { number: 10, clue: 'Zwierzę drapieżne, lądowy drapieżnik (6 liter)' },
                    { number: 15, clue: 'Największy zwierzę lądowe (6 liter)' }
                ],
                vertical: [
                    { number: 1, clue: 'Duży drapieżnik z grzywą (5 liter)' },
                    { number: 2, clue: 'Domowe zwierzę które kra kra (3 litery)' },
                    { number: 3, clue: 'Gryzek z długim ogonem (5 liter)' },
                    { number: 4, clue: 'Zwierzę które latają (3 litery)' },
                    { number: 5, clue: 'Czworonóg, przyjaciel człowieka (3 litery)' }
                ]
            },
            answers: {
                1: { word: 'LEW', direction: 'H', row: 0, col: 0 },
                4: { word: 'KOT', direction: 'H', row: 0, col: 4 },
                6: { word: 'WIEWIÓRKA', direction: 'H', row: 2, col: 0 },
                10: { word: 'ORZEŁ', direction: 'H', row: 4, col: 4 },
                15: { word: 'SŁOŃ', direction: 'H', row: 6, col: 4 }
            }
        };

        let userAnswers = {};

        // Inicjalizacja krzyżówki
        function initCrossword() {
            const gridContainer = document.getElementById('crosswordGrid');
            const grid = crosswordData.grid;

            grid.forEach((row, rowIdx) => {
                const rowDiv = document.createElement('div');
                rowDiv.className = 'row';

                row.forEach((cell, colIdx) => {
                    const cellDiv = document.createElement('div');
                    cellDiv.className = 'cell' + (cell === 0 ? ' black' : '');

                    if (cell !== 0) {
                        const input = document.createElement('input');
                        input.type = 'text';
                        input.maxLength = '1';
                        input.dataset.row = rowIdx;
                        input.dataset.col = colIdx;

                        input.addEventListener('input', (e) => {
                            const value = e.target.value.toUpperCase();
                            if (value && !/[A-Z]/.test(value)) {
                                e.target.value = '';
                            } else {
                                e.target.value = value;
                            }
                            userAnswers[`${rowIdx}-${colIdx}`] = value;
                        });

                        input.addEventListener('keydown', (e) => {
                            if (e.key === 'ArrowRight' || e.key === 'Tab') {
                                e.preventDefault();
                                focusNext(rowIdx, colIdx, 'H');
                            } else if (e.key === 'ArrowDown') {
                                e.preventDefault();
                                focusNext(rowIdx, colIdx, 'V');
                            } else if (e.key === 'ArrowLeft' || e.key === 'Shift+Tab') {
                                e.preventDefault();
                                focusPrev(rowIdx, colIdx, 'H');
                            } else if (e.key === 'ArrowUp') {
                                e.preventDefault();
                                focusPrev(rowIdx, colIdx, 'V');
                            }
                        });

                        cellDiv.appendChild(input);
                    }

                    rowDiv.appendChild(cellDiv);
                });

                gridContainer.appendChild(rowDiv);
            });

            generateClueNumbers();
            displayClues();
        }

        function generateClueNumbers() {
            const grid = crosswordData.grid;
            let clueNumber = 1;

            for (let row = 0; row < grid.length; row++) {
                for (let col = 0; col < grid[row].length; col++) {
                    if (grid[row][col] !== 0) {
                        const isStartOfHorizontal = col === 0 || grid[row][col - 1] === 0;
                        const isStartOfVertical = row === 0 || grid[row - 1][col] === 0;

                        if (isStartOfHorizontal || isStartOfVertical) {
                            const cell = document.querySelector(`input[data-row="${row}"][data-col="${col}"]`).parentElement;
                            const numberSpan = document.createElement('div');
                            numberSpan.className = 'cell-number';
                            numberSpan.textContent = clueNumber;
                            cell.appendChild(numberSpan);
                            clueNumber++;
                        }
                    }
                }
            }
        }

        function displayClues() {
            const horizontalCluesDiv = document.getElementById('horizontalClues');
            const verticalCluesDiv = document.getElementById('verticalClues');

            crosswordData.clues.horizontal.forEach(clue => {
                const clueDiv = document.createElement('div');
                clueDiv.className = 'clue';
                clueDiv.innerHTML = `<span class="clue-number">${clue.number}.</span><span class="clue-text">${clue.clue}</span>`;
                horizontalCluesDiv.appendChild(clueDiv);
            });

            crosswordData.clues.vertical.forEach(clue => {
                const clueDiv = document.createElement('div');
                clueDiv.className = 'clue';
                clueDiv.innerHTML = `<span class="clue-number">${clue.number}.</span><span class="clue-text">${clue.clue}</span>`;
                verticalCluesDiv.appendChild(clueDiv);
            });
        }

        function focusNext(row, col, direction) {
            const grid = crosswordData.grid;
            let nextRow = row, nextCol = col;

            if (direction === 'H') {
                nextCol++;
            } else {
                nextRow++;
            }

            while (nextRow < grid.length && nextCol < grid[0].length) {
                if (grid[nextRow][nextCol] !== 0) {
                    const input = document.querySelector(`input[data-row="${nextRow}"][data-col="${nextCol}"]`);
                    if (input) {
                        input.focus();
                        return;
                    }
                }
                if (direction === 'H') {
                    nextCol++;
                } else {
                    nextRow++;
                }
            }
        }

        function focusPrev(row, col, direction) {
            const grid = crosswordData.grid;
            let prevRow = row, prevCol = col;

            if (direction === 'H') {
                prevCol--;
            } else {
                prevRow--;
            }

            while (prevRow >= 0 && prevCol >= 0) {
                if (prevRow < grid.length && prevCol < grid[prevRow].length && grid[prevRow][prevCol] !== 0) {
                    const input = document.querySelector(`input[data-row="${prevRow}"][data-col="${prevCol}"]`);
                    if (input) {
                        input.focus();
                        return;
                    }
                }
                if (direction === 'H') {
                    prevCol--;
                } else {
                    prevRow--;
                }
            }
        }

        function checkAnswers() {
            const grid = crosswordData.grid;
            let correctCount = 0;
            let totalCount = 0;

            for (let row = 0; row < grid.length; row++) {
                for (let col = 0; col < grid[row].length; col++) {
                    if (grid[row][col] !== 0) {
                        const input = document.querySelector(`input[data-row="${row}"][data-col="${col}"]`);
                        const userAnswer = input.value.toUpperCase();
                        const correctAnswer = grid[row][col];

                        totalCount++;

                        if (userAnswer === correctAnswer) {
                            input.classList.add('correct');
                            input.classList.remove('incorrect');
                            correctCount++;
                        } else {
                            input.classList.add('incorrect');
                            input.classList.remove('correct');
                        }
                    }
                }
            }

            const resultDiv = document.getElementById('resultMessage');
            const scoreDiv = document.getElementById('score');

            if (correctCount === totalCount) {
                resultDiv.textContent = '🎉 Gratulacje! Rozwiązałeś krzyżówkę!';
                resultDiv.classList.add('success');
                resultDiv.classList.remove('error');
            } else {
                resultDiv.textContent = `⚠️ Spróbuj jeszcze raz! ${correctCount}/${totalCount} poprawnych.`;
                resultDiv.classList.add('error');
                resultDiv.classList.remove('success');
            }

            scoreDiv.textContent = `Wynik: ${correctCount}/${totalCount}`;
        }

        function resetCrossword() {
            const inputs = document.querySelectorAll('.cell input');
            inputs.forEach(input => {
                input.value = '';
                input.classList.remove('correct', 'incorrect');
            });
            userAnswers = {};
            document.getElementById('resultMessage').classList.remove('success', 'error');
            document.getElementById('score').textContent = '';
        }

        function showHint() {
            const inputs = document.querySelectorAll('.cell input');
            const emptyInputs = Array.from(inputs).filter(input => input.value === '');

            if (emptyInputs.length === 0) {
                alert('Wszystkie pola są wypełnione!');
                return;
            }

            const randomInput = emptyInputs[Math.floor(Math.random() * emptyInputs.length)];
            const row = parseInt(randomInput.dataset.row);
            const col = parseInt(randomInput.dataset.col);
            const correctAnswer = crosswordData.grid[row][col];

            randomInput.value = correctAnswer;
            userAnswers[`${row}-${col}`] = correctAnswer;
        }

        // Uruchomienie
        initCrossword();
    </script>
</body>
</html>
