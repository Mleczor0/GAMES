<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hakowanie Rozpoczęto</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 50%, #0f1629 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            color: #e0e0e0;
            position: relative;
            overflow-x: hidden;
        }

        /* Animowane tło z gwiazdkami */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(2px 2px at 20% 30%, #eee, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 60% 70%, #fff, rgba(0,0,0,0)),
                radial-gradient(1px 1px at 50% 50%, #ddd, rgba(0,0,0,0)),
                radial-gradient(1px 1px at 80% 10%, #fff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 90% 60%, #eee, rgba(0,0,0,0));
            background-repeat: repeat;
            background-size: 200% 200%;
            pointer-events: none;
            z-index: -1;
            animation: twinkle 5s infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 0.8; }
        }

        /* Navbar */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            background: rgba(10, 14, 39, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(66, 135, 245, 0.2);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 1.2em;
            cursor: pointer;
        }

        .nav-links {
            display: flex;
            gap: 30px;
            align-items: center;
        }

        .nav-links a {
            color: #a0a0a0;
            text-decoration: none;
            font-size: 0.95em;
            transition: color 0.3s ease;
            cursor: pointer;
        }

        .nav-links a:hover {
            color: #4287f5;
        }

        .laptop-icon {
            font-size: 1.5em;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .laptop-icon:hover {
            color: #4287f5;
            transform: scale(1.1);
        }

        /* Modal dla twórcy */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            animation: fadeIn 0.3s ease;
        }

        .modal.show {
            display: flex;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            animation: slideDown 0.5s ease;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .discord-logo {
            font-size: 5em;
            animation: discordPulse 1s ease;
        }

        @keyframes discordPulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.7; transform: scale(1.1); }
        }

        .creator-name {
            font-family: 'Comic Sans MS', cursive;
            font-size: 3em;
            color: #4287f5;
            text-shadow: 0 0 20px rgba(66, 135, 245, 0.8);
            animation: fadeOut 5s ease forwards;
            margin-top: 20px;
        }

        @keyframes fadeOut {
            0% { opacity: 1; }
            80% { opacity: 1; }
            100% { opacity: 0; }
        }

        .container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 60px 20px;
        }

        .content-wrapper {
            background: rgba(26, 31, 58, 0.6);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(66, 135, 245, 0.2);
            border-radius: 20px;
            padding: 60px;
            max-width: 1000px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }

        .header {
            text-align: center;
            margin-bottom: 50px;
        }

        .badge {
            display: inline-block;
            border: 1px solid rgba(66, 135, 245, 0.5);
            border-radius: 30px;
            padding: 8px 16px;
            font-size: 0.85em;
            color: #4287f5;
            margin-bottom: 20px;
            letter-spacing: 1px;
        }

        h1 {
            font-size: 3em;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #fff 0%, #4287f5 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 3px;
        }

        .module-title {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            font-size: 1.4em;
            color: #4287f5;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 25px;
        }

        .module-title-emoji {
            font-size: 1.3em;
        }

        .subtitle {
            font-size: 1.2em;
            color: #a0a0a0;
            margin-bottom: 10px;
        }

        .description {
            color: #707090;
            font-size: 0.95em;
            line-height: 1.6;
            max-width: 600px;
            margin: 0 auto;
        }

        .crossword-section {
            margin-bottom: 40px;
        }

        .crossword-section h2 {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 12px;
            color: #4287f5;
            margin-bottom: 25px;
            font-size: 1.4em;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .section-emoji {
            font-size: 1.3em;
        }

        .crossword-grid {
            display: flex;
            flex-direction: column;
            gap: 20px;
            background: rgba(10, 14, 39, 0.9);
            border: 2px solid rgba(66, 135, 245, 0.3);
            border-radius: 8px;
            padding: 30px;
            box-shadow: 0 0 20px rgba(66, 135, 245, 0.2);
        }

        .clue-row {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .clue-number {
            font-weight: bold;
            color: #4287f5;
            font-size: 1.1em;
            min-width: 30px;
            background: rgba(66, 135, 245, 0.15);
            padding: 8px 12px;
            border-radius: 5px;
            text-align: center;
        }

        .clue-text {
            color: #c0c0c0;
            font-size: 0.9em;
            min-width: 200px;
            flex: 1;
            line-height: 1.4;
        }

        .input-row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .cell {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .cell input {
            width: 100%;
            height: 100%;
            border: 2px solid rgba(66, 135, 245, 0.4);
            text-align: center;
            font-size: 16px;
            font-weight: bold;
            text-transform: uppercase;
            background: rgba(26, 31, 58, 0.9);
            color: #fff;
            border-radius: 5px;
            cursor: text;
            transition: all 0.2s ease;
        }

        .cell input:focus {
            background: rgba(66, 135, 245, 0.2);
            border-color: #4287f5;
            outline: none;
            box-shadow: 0 0 10px rgba(66, 135, 245, 0.5);
        }

        .cell input.correct {
            color: #4ade80;
            background: rgba(74, 222, 128, 0.2);
            border-color: #4ade80;
        }

        .cell input.correct.remove-highlight {
            background: rgba(26, 31, 58, 0.9);
            border-color: rgba(66, 135, 245, 0.4);
            color: #fff;
        }

        .cell input.incorrect {
            color: #ff6b6b;
            background: rgba(255, 107, 107, 0.2);
            border-color: #ff6b6b;
        }

        .cell input.incorrect.remove-highlight {
            background: rgba(26, 31, 58, 0.9);
            border-color: rgba(66, 135, 245, 0.4);
            color: #fff;
        }

        .button-container {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 30px;
        }

        button {
            padding: 14px 35px;
            font-size: 1em;
            border: 2px solid;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            background: transparent;
        }

        .btn-check {
            border-color: #4ade80;
            color: #4ade80;
        }

        .btn-check:hover {
            background: rgba(74, 222, 128, 0.15);
            box-shadow: 0 0 20px rgba(74, 222, 128, 0.3);
            transform: translateY(-2px);
        }

        .btn-reset {
            border-color: #ff6b6b;
            color: #ff6b6b;
        }

        .btn-reset:hover {
            background: rgba(255, 107, 107, 0.15);
            box-shadow: 0 0 20px rgba(255, 107, 107, 0.3);
            transform: translateY(-2px);
        }

        .result-message {
            text-align: center;
            font-size: 1.1em;
            font-weight: bold;
            padding: 20px 30px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: none;
            border: 2px solid;
            backdrop-filter: blur(10px);
        }

        .result-message.success {
            background: rgba(74, 222, 128, 0.1);
            color: #4ade80;
            border-color: #4ade80;
        }

        .result-message.error {
            background: rgba(255, 107, 107, 0.1);
            color: #ff6b6b;
            border-color: #ff6b6b;
        }

        .score {
            text-align: center;
            font-size: 1.1em;
            color: #4287f5;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .modules-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 40px;
            padding: 20px;
            background: rgba(10, 14, 39, 0.9);
            border: 2px solid rgba(66, 135, 245, 0.3);
            border-radius: 15px;
            flex-wrap: wrap;
        }

        .module-item {
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid rgba(66, 135, 245, 0.4);
            border-radius: 10px;
            background: rgba(26, 31, 58, 0.8);
            font-size: 1.8em;
            transition: all 0.3s ease;
            cursor: default;
        }

        .module-item.active {
            border-color: #4287f5;
            background: rgba(66, 135, 245, 0.2);
            box-shadow: 0 0 20px rgba(66, 135, 245, 0.4);
            transform: scale(1.1);
        }

        .module-item.inactive {
            opacity: 0.6;
        }

        /* Loading Screen */
        .loading-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            gap: 40px;
        }

        .loading-overlay.show {
            display: flex;
        }

        .access-text {
            font-size: 3em;
            color: #4ade80;
            font-weight: bold;
            text-shadow: 0 0 20px rgba(74, 222, 128, 0.8);
            animation: glow 1s infinite alternate;
            letter-spacing: 2px;
        }

        @keyframes glow {
            from {
                text-shadow: 0 0 20px rgba(74, 222, 128, 0.8);
            }
            to {
                text-shadow: 0 0 40px rgba(74, 222, 128, 1), 0 0 60px rgba(74, 222, 128, 0.8);
            }
        }

        @keyframes grow {
            from {
                transform: scale(1);
            }
            to {
                transform: scale(1.2);
            }
        }

        .access-text.grow {
            animation: grow 0.5s ease-out;
        }

        .loading-bar {
            width: 300px;
            height: 30px;
            background: rgba(26, 31, 58, 0.9);
            border: 2px solid rgba(74, 222, 128, 0.4);
            border-radius: 10px;
            overflow: hidden;
            position: relative;
        }

        .loading-fill {
            height: 100%;
            background: linear-gradient(90deg, #4ade80, #6ee7b7);
            width: 0%;
            transition: width 0.1s linear;
            box-shadow: 0 0 10px rgba(74, 222, 128, 0.8);
        }

        .loading-text {
            color: #4ade80;
            font-size: 1.2em;
            font-weight: bold;
            min-width: 60px;
            text-align: right;
        }

        @media (max-width: 768px) {
            .navbar {
                padding: 15px 20px;
            }

            .content-wrapper {
                padding: 30px;
            }

            h1 {
                font-size: 2em;
            }

            .clue-row {
                flex-direction: column;
                align-items: flex-start;
            }

            .cell {
                width: 35px;
                height: 35px;
            }

            button {
                padding: 10px 20px;
                font-size: 0.9em;
            }

            .modules-container {
                gap: 10px;
            }

            .module-item {
                width: 50px;
                height: 50px;
                font-size: 1.5em;
            }

            .access-text {
                font-size: 2em;
            }

            .loading-bar {
                width: 250px;
            }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="logo">⚠️ HAKOWANIE</div>
        <div class="nav-links">
            <a onclick="openCreatorModal()">Twórca</a>
            <span class="laptop-icon">💻</span>
        </div>
    </nav>

    <!-- Modal dla twórcy -->
    <div class="modal" id="creatorModal">
        <div class="modal-content">
            <div class="discord-logo">🎮</div>
            <div class="creator-name">Mleczor0</div>
        </div>
    </div>

    <!-- Loading Screen -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="access-text" id="accessText">UZYSKANO DOSTĘP</div>
        <div class="loading-bar">
            <div class="loading-fill" id="loadingFill"></div>
        </div>
        <div class="loading-text" id="loadingText">0%</div>
    </div>

    <div class="container">
        <div class="content-wrapper" id="contentWrapper">
            <div class="header">
                <div class="badge">🔓 HAKOWANIE ROZPOCZĘTO 🔐</div>
                <h1>Wprowadź Dane</h1>
                <p class="subtitle">Dostęp do systemu wymaga znajomości tajnych informacji</p>
                <p class="description">Jeśli znasz historię, poznasz jej sekret.</p>
            </div>

            <div class="crossword-section">
                <h2><span class="section-emoji">📄</span>Moduł I</h2>
                <div class="crossword-grid" id="crosswordGrid"></div>
            </div>

            <div class="button-container">
                <button class="btn-check" onclick="checkAnswers()">✓ Zweryfikuj Dostęp</button>
                <button class="btn-reset" onclick="resetCrossword()">↻ Wyczyść</button>
            </div>

            <div class="result-message" id="resultMessage"></div>
            <div class="score" id="score"></div>

            <div class="modules-container" id="modulesContainer"></div>
        </div>
    </div>

    <script>
        // Audio context
        const audioContext = new (window.AudioContext || window.webkitAudioContext)();

        function playClickSound() {
            const osc = audioContext.createOscillator();
            const gain = audioContext.createGain();
            osc.connect(gain);
            gain.connect(audioContext.destination);
            osc.frequency.value = 800;
            osc.type = 'sine';
            gain.gain.setValueAtTime(0.3, audioContext.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.1);
            osc.start(audioContext.currentTime);
            osc.stop(audioContext.currentTime + 0.1);
        }

        function playLoadingSound() {
            const osc = audioContext.createOscillator();
            const gain = audioContext.createGain();
            osc.connect(gain);
            gain.connect(audioContext.destination);
            osc.frequency.value = 400;
            osc.type = 'sine';
            gain.gain.setValueAtTime(0.2, audioContext.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.2);
            osc.start(audioContext.currentTime);
            osc.stop(audioContext.currentTime + 0.2);
        }

        function playSuccessSound() {
            const osc = audioContext.createOscillator();
            const gain = audioContext.createGain();
            osc.connect(gain);
            gain.connect(audioContext.destination);
            osc.frequency.setValueAtTime(600, audioContext.currentTime);
            osc.frequency.linearRampToValueAtTime(1000, audioContext.currentTime + 0.15);
            osc.type = 'sine';
            gain.gain.setValueAtTime(0.3, audioContext.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.15);
            osc.start(audioContext.currentTime);
            osc.stop(audioContext.currentTime + 0.15);
        }

        // Definicja krzyżówki
        const crosswordData = [
            { number: 1, clue: 'Imię pierwszej ofiary Yami w Los Santos', answer: 'LUIZ', length: 4 },
            { number: 2, clue: 'Nazwisko kobiety która pracowała na stacji benzynowej', answer: 'ROGERS', length: 6 },
            { number: 3, clue: 'Pojazd który porwał partnerkę Leona', answer: 'BALLER', length: 6 },
            { number: 4, clue: 'Ilość japońców którzy pilnowali furgonetki na Human\'s Labs', answer: '4', length: 1 },
            { number: 5, clue: 'Imię psa Pana B', answer: 'KRUSZYNKA', length: 9 },
            { number: 6, clue: 'Handlował tym inspektor', answer: 'YAROI', length: 5 },
            { number: 7, clue: 'Jedna z trzech lokalizacji mapy Victora Vectora', answer: 'RZEZNIA', length: 7 },
            { number: 8, clue: 'Czego nie miał Gregory kiedy Yami chciała rozpocząć zabawę?', answer: 'ZASIEGU', length: 7 },
            { number: 9, clue: 'Nazwisko twórcy', answer: 'KURO', length: 4 },
            { number: 10, clue: 'Nazwisko wokalisty którego utwór można usłyszeć w grze 6 ★', answer: 'FEASTER', length: 7 },
            { number: 11, clue: 'Jak miał na imię strażnik na wieży na operacji na lotnisku Sandy Shores', answer: 'GEORGE', length: 6 }
        ];

        const moduleEmojis = ['📄', '🔑', '💾', '⚙️', '🎯', '🔐', '📡', '🎲', '💎', '🌌'];
        let userAnswers = {};
        let highlightedIndices = new Set();

        function openCreatorModal() {
            playClickSound();
            const modal = document.getElementById('creatorModal');
            modal.classList.add('show');
            
            setTimeout(() => {
                modal.classList.remove('show');
            }, 5000);
        }

        // Inicjalizacja krzyżówki
        function initCrossword() {
            const gridContainer = document.getElementById('crosswordGrid');
            gridContainer.innerHTML = '';

            crosswordData.forEach((item, index) => {
                const rowDiv = document.createElement('div');
                rowDiv.className = 'clue-row';

                const numberSpan = document.createElement('div');
                numberSpan.className = 'clue-number';
                numberSpan.textContent = item.number;

                const clueSpan = document.createElement('div');
                clueSpan.className = 'clue-text';
                clueSpan.textContent = item.clue;

                const inputRowDiv = document.createElement('div');
                inputRowDiv.className = 'input-row';
                inputRowDiv.id = `row-${index}`;

                // Tworzenie pól input dla każdej litery
                for (let i = 0; i < item.length; i++) {
                    const cellDiv = document.createElement('div');
                    cellDiv.className = 'cell';

                    const input = document.createElement('input');
                    input.type = 'text';
                    input.maxLength = '1';
                    input.dataset.index = index;
                    input.dataset.position = i;
                    input.dataset.answer = item.answer;

                    input.addEventListener('click', () => {
                        playClickSound();
                    });

                    input.addEventListener('input', (e) => {
                        const value = e.target.value.toUpperCase();
                        // Validation
                        if (value && !/[A-Z0-9]/.test(value)) {
                            e.target.value = '';
                            return;
                        }
                        e.target.value = value;

                        // Auto-jump do następnego pola
                        if (value) {
                            const nextPosition = parseInt(i) + 1;
                            if (nextPosition < item.length) {
                                const nextInput = document.querySelector(`input[data-index="${index}"][data-position="${nextPosition}"]`);
                                if (nextInput) {
                                    nextInput.focus();
                                }
                            }
                        }

                        // Zapisz odpowiedź
                        if (!userAnswers[index]) {
                            userAnswers[index] = [];
                        }
                        userAnswers[index][i] = value;
                    });

                    input.addEventListener('keydown', (e) => {
                        if (e.key === 'Backspace' && !e.target.value) {
                            const prevPosition = parseInt(i) - 1;
                            if (prevPosition >= 0) {
                                const prevInput = document.querySelector(`input[data-index="${index}"][data-position="${prevPosition}"]`);
                                if (prevInput) {
                                    prevInput.focus();
                                    prevInput.value = '';
                                    if (userAnswers[index]) {
                                        userAnswers[index][prevPosition] = '';
                                    }
                                }
                            }
                        }
                    });

                    cellDiv.appendChild(input);
                    inputRowDiv.appendChild(cellDiv);
                }

                rowDiv.appendChild(numberSpan);
                rowDiv.appendChild(clueSpan);
                rowDiv.appendChild(inputRowDiv);
                gridContainer.appendChild(rowDiv);
            });
        }

        // Inicjalizacja modułów
        function initModules() {
            const modulesContainer = document.getElementById('modulesContainer');
            modulesContainer.innerHTML = '';

            for (let i = 0; i < 5; i++) {
                const moduleItem = document.createElement('div');
                moduleItem.className = 'module-item';
                if (i === 0) {
                    moduleItem.classList.add('active');
                } else {
                    moduleItem.classList.add('inactive');
                }
                
                const emoji = moduleEmojis[Math.floor(Math.random() * moduleEmojis.length)];
                moduleItem.textContent = emoji;
                modulesContainer.appendChild(moduleItem);
            }
        }

        function startLoadingSequence() {
            playSuccessSound();
            const loadingOverlay = document.getElementById('loadingOverlay');
            const accessText = document.getElementById('accessText');
            const loadingFill = document.getElementById('loadingFill');
            const loadingText = document.getElementById('loadingText');
            const contentWrapper = document.getElementById('contentWrapper');

            loadingOverlay.classList.add('show');
            contentWrapper.style.display = 'none';

            let progress = 0;
            const totalTime = 35000; // 35 seconds
            const startTime = Date.now();

            const interval = setInterval(() => {
                const elapsed = Date.now() - startTime;
                
                if (elapsed < 30000) {
                    // 0-84% over 30 seconds
                    progress = (elapsed / 30000) * 84;
                } else if (elapsed < 35000) {
                    // Stay at 84% for 5 seconds
                    progress = 84;
                } else {
                    // 84-100% instantly
                    progress = 100;
                }

                // Play loading sound periodically
                if (Math.floor(progress) % 10 === 0 && Math.floor(progress) !== Math.floor((elapsed - 100) / totalTime * 100)) {
                    playLoadingSound();
                }

                loadingFill.style.width = progress + '%';
                loadingText.textContent = Math.floor(progress) + '%';

                if (progress >= 100) {
                    clearInterval(interval);
                    accessText.classList.add('grow');
                    playSuccessSound();
                    
                    setTimeout(() => {
                        // Redirect to module 2
                        loadToModule2();
                    }, 1000);
                }
            }, 50);
        }

        function loadToModule2() {
            // Here we can redirect or load the next module
            // For now, we'll create a simple Snake game
            window.location.href = 'module2.html';
        }

        function checkAnswers() {
            playClickSound();
            let correctCount = 0;
            let totalCount = crosswordData.length;
            highlightedIndices.clear();

            crosswordData.forEach((item, index) => {
                const userAnswer = (userAnswers[index] || []).join('').toUpperCase();
                const correctAnswer = item.answer;
                const inputRow = document.getElementById(`row-${index}`);
                const inputs = inputRow.querySelectorAll('input');

                if (userAnswer === correctAnswer) {
                    inputs.forEach(inp => {
                        inp.classList.add('correct');
                        inp.classList.remove('incorrect');
                    });
                    correctCount++;
                } else {
                    inputs.forEach(inp => {
                        inp.classList.add('incorrect');
                        inp.classList.remove('correct');
                    });
                    highlightedIndices.add(index);
                }
            });

            const resultDiv = document.getElementById('resultMessage');
            const scoreDiv = document.getElementById('score');

            if (correctCount === totalCount) {
                resultDiv.textContent = '🔓 DOSTĘP PRZYZNANY! Zostałeś zaakceptowany w systemie!';
                resultDiv.classList.add('success');
                resultDiv.classList.remove('error');
                playSuccessSound();
                
                // Start loading sequence after 1 second
                setTimeout(() => {
                    startLoadingSequence();
                }, 1000);
            } else {
                resultDiv.textContent = `🔒 DOSTĘP ODMÓWIONY! ${correctCount}/${totalCount} poprawnych. Spróbuj ponownie.`;
                resultDiv.classList.add('error');
                resultDiv.classList.remove('success');
            }

            scoreDiv.textContent = `Status: ${correctCount}/${totalCount}`;

            // Usuń podświetlenie czerwonych po 5 sekundach
            setTimeout(() => {
                highlightedIndices.forEach(idx => {
                    const inputRow = document.getElementById(`row-${idx}`);
                    const inputs = inputRow.querySelectorAll('input');
                    inputs.forEach(inp => {
                        inp.classList.add('remove-highlight');
                        inp.classList.remove('incorrect');
                    });
                });
            }, 5000);
        }

        function resetCrossword() {
            playClickSound();
            const inputs = document.querySelectorAll('.cell input');
            inputs.forEach(input => {
                input.value = '';
                input.classList.remove('correct', 'incorrect', 'remove-highlight');
            });
            userAnswers = {};
            highlightedIndices.clear();
            document.getElementById('resultMessage').classList.remove('success', 'error');
            document.getElementById('resultMessage').textContent = '';
            document.getElementById('score').textContent = '';
        }

        // Uruchomienie
        initCrossword();
        initModules();
    </script>
</body>
</html>
